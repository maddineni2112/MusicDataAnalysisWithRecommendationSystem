{% extends "music/base.html" %}
{% block content %}
<main class="page-shell">
  <section class="page-heading">
    <p class="eyebrow">Indian Music Intelligence Platform</p>
    <h1>Dashboard</h1>
    <p>Explore Indian music data across tracks, artists, playlists, inferred labels, and recommendation coverage.</p>
  </section>
  <section class="grid kpi-grid" data-widget="overview"></section>
  <section class="panel">
    <h2>Language Trends</h2>
    <div data-widget="trends"></div>
  </section>
  <section class="panel">
    <h2>Data Quality Summary</h2>
    <div data-widget="quality-summary"></div>
  </section>
</main>
{% endblock %}
