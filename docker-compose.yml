services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-music_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-music_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-music_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-music_user} -d ${POSTGRES_DB:-music_intelligence}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    env_file:
      - .env.example
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  django:
    build:
      context: ./django_music
    env_file:
      - .env.example
    ports:
      - "8000:8000"
    volumes:
      - ./django_music:/app
    depends_on:
      - api
    command: python manage.py runserver 0.0.0.0:8000

volumes:
  postgres_data:
